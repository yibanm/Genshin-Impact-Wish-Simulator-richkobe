# 云端构建（GitHub Actions）
#
# 遵循 CLAUDE.md 0.11：推开发分支触发构建，产物上传为 workflow artifact，
# 由本地用 `gh run download` 拉回 dist-release/ 供用户测试；
# 未经用户明确指示，不合并主干、不打 tag、不创建 Release。
#
# 产物命名遵循 CLAUDE.md 0.10（软件名-版本-平台.扩展名）：
#   - genshin-wish-roll-richkobe-<版本>-web.zip                  Web 静态站
#   - genshin-wish-roll-richkobe-<版本>-windows-x64-setup.exe    Windows 安装版（NSIS）
#   - genshin-wish-roll-richkobe-<版本>-windows-x64-portable.zip Windows 便携版
name: build-artifacts

on:
  push:
    branches: [dev, build, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Tauri 需要 Rust 工具链编译原生壳（WebView2 由系统提供，不打包进产物）
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Cargo 缓存：Rust 首次编译需数分钟，缓存 target 与 registry 大幅缩短后续构建。
      # 用 MIT 的 actions/cache 而非 Swatinem/rust-cache（后者 LGPL-3.0，传染性许可证，
      # 按项目规则不引入 CI 流程）
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web bundle (SvelteKit static)
        run: npm run build
        env:
          # .env 被 gitignore（含占位密钥），CI 用环境变量注入品牌文案；
          # Vite 的 loadEnv 会读取 process.env 中 VITE_ 前缀变量
          VITE_HOST: ''
          VITE_APP_TITLE: 原神祈愿模拟器
          VITE_DESCRIPTION: 原神风格抽卡 + 多名单点名工具：无广告与第三方服务，可完全离线使用
          VITE_KEYWORDS: 原神,抽卡模拟器,祈愿,点名器,卡池,中文

      - name: Read version from package.json
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Web 静态站：把 dist 压成 zip
      # 必须用 .NET ZipFile 而非 Compress-Archive：后者写入反斜杠路径分隔符，
      # Linux/macOS 的 unzip 会解成一堆带反斜杠的平铺文件名（目录结构丢失），
      # 与 README「任意平台可用」矛盾。ZipFile 写标准正斜杠分隔符。
      - name: Package web zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $out = "genshin-wish-roll-richkobe-$v-web.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory("$PWD\dist", "$PWD\$out", [System.IO.Compression.CompressionLevel]::Optimal, $false)
          Write-Host "已生成 $out"

      # 桌面版：只编译主程序 exe（--no-bundle），安装器由下方自写 NSIS MUI2 脚本负责，
      # 便携版直接把这个 exe 压 zip。不再需要 Tauri 自带 NSIS bundle。
      - name: Build Tauri app
        run: npx tauri build --no-bundle
        env:
          # tauri 的 beforeBuildCommand 会再跑一次 vite build 覆盖 dist，
          # 这里必须重复注入品牌文案环境变量，否则第二次构建的 dist 会丢标题/描述
          VITE_HOST: ''
          VITE_APP_TITLE: 原神祈愿模拟器
          VITE_DESCRIPTION: 原神风格抽卡 + 多名单点名工具：无广告与第三方服务，可完全离线使用
          VITE_KEYWORDS: 原神,抽卡模拟器,祈愿,点名器,卡池,中文
          # Tauri 不需要代码签名证书即可产出未签名包；显式关掉避免它去找证书
          TAURI_SIGNING_PRIVATE_KEY: ''
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 安装器：用自写 NSIS MUI2 脚本（茶话式左大图 + 可改图标），替代 Tauri 默认简化模板。
      # .nsi 脚本用相对路径引用 exe/bmp，必须在 installer 目录里编译；产物落在 ../output/。
      # 注意：--no-bundle 后 Tauri 不再自动下载 NSIS，必须自己装；choco 的 nsis 包不改 PATH，
      # 装完要显式定位 makensis.exe 并写进 GITHUB_PATH，下一个 step 才能直接调用。
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $found = $null
          foreach ($p in @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\ProgramData\chocolatey\bin\makensis.exe"
          )) { if (Test-Path $p) { $found = $p; break } }
          if (-not $found) {
            $found = (Get-ChildItem -Path "C:\Program Files (x86)\NSIS","C:\ProgramData\chocolatey" `
              -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $found) { throw "choco 安装后未找到 makensis.exe" }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $found)
          & $found /VERSION
          Write-Host "makensis 定位: $found"

      - name: Build MUI2 installer
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path output | Out-Null
          Push-Location installer
          makensis /V2 genshin-wish-roll.nsi
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "makensis 编译失败 (exit $LASTEXITCODE)" }
          Pop-Location
          $mui = "output\genshin-wish-roll-richkobe-$v-windows-x64-setup.exe"
          if (-not (Test-Path $mui)) { throw "MUI2 installer 未产出: $mui" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -Path $mui -Destination "release\genshin-wish-roll-richkobe-$v-windows-x64-setup.exe" -Force
          Write-Host "安装版(MUI2): $mui -> release\"

      # 便携版：Tauri 的 exe 自带前端资源，单文件即可运行，直接压 zip
      - name: Package portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $out = "genshin-wish-roll-richkobe-$v-windows-x64-portable.zip"
          # Cargo package name = genshin-wish-roll（见 src-tauri/Cargo.toml 的 name）
          $exe = "src-tauri\target\release\genshin-wish-roll.exe"
          if (-not (Test-Path $exe)) { throw "未找到 $exe，Tauri 可能未产出主程序" }
          $stage = "portable\原神祈愿模拟器.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $stage) | Out-Null
          Copy-Item -Path $exe -Destination $stage -Force
          $size = (Get-Item $exe).Length / 1MB
          Write-Host ("便携版 exe 体积: {0:N1} MB" -f $size)
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory("$PWD\portable", "$PWD\$out", [System.IO.Compression.CompressionLevel]::Optimal, $false)
          Write-Host "已生成 $out"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            genshin-wish-roll-richkobe-${{ steps.ver.outputs.version }}-web.zip
            release/genshin-wish-roll-richkobe-${{ steps.ver.outputs.version }}-windows-x64-setup.exe
            genshin-wish-roll-richkobe-${{ steps.ver.outputs.version }}-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 30

  # 安卓移植版：Capacitor 壳打包同一份 Web 产物（完全离线，无外部服务）
  # 签名走仓库 secrets 的主密钥（base64 + 密码），保证覆盖安装可升级
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Capacitor 8 的 CLI 硬性要求 Node >= 22（本地 node 24 能跑，CI 的 20 会 fatal）
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web bundle (SvelteKit static)
        run: npm run build
        env:
          VITE_HOST: ''
          VITE_APP_TITLE: 原神祈愿模拟器
          VITE_DESCRIPTION: 原神风格抽卡 + 多名单点名工具：无广告与第三方服务，可完全离线使用
          VITE_KEYWORDS: 原神,抽卡模拟器,祈愿,点名器,卡池,中文

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sync web bundle into Capacitor android project
        run: npx cap sync android

      - name: Read version from package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          GIWS_KEYSTORE_BASE64: ${{ secrets.GIWS_KEYSTORE_BASE64 }}
          GIWS_KEYSTORE_PASSWORD: ${{ secrets.GIWS_KEYSTORE_PASSWORD }}
        run: |
          # keystore 必须落在 android/app/ 下：build.gradle 的 signingConfigs 用
          # file(keyProps['storeFile'])，相对路径以 app 模块目录为基准解析
          echo "$GIWS_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          # key.properties 用相对名：Java Properties 反斜杠是转义符，这里无路径分隔符最稳
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=$GIWS_KEYSTORE_PASSWORD"
            echo "keyAlias=richkobe"
            echo "keyPassword=$GIWS_KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain

      - name: Verify signature fingerprint
        working-directory: android
        run: |
          APK=$(find app/build/outputs/apk/release -name "*-android-arm64.apk" | head -1)
          echo "APK: $APK"
          # 主密钥 SHA-256 指纹（CLAUDE.md 0.10），不符即失败，防止误用 debug 签名发版
          EXPECTED="7ca63dca32db31b1de61257eeee60e883c04f660381f8f3e678b70f66d1f13b4"
          ACTUAL=$(${ANDROID_HOME}/build-tools/36.0.0/apksigner verify --print-certs "$APK" | grep -i "SHA-256" | head -1 | sed 's/.*: //')
          echo "实际指纹: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then echo "签名指纹与主密钥不符！"; exit 1; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: android/app/build/outputs/apk/release/genshin-wish-roll-richkobe-${{ steps.ver.outputs.version }}-android-arm64.apk
          if-no-files-found: error
          retention-days: 30

  # 发版搬运：把本 run 的三个发布资产挂到 v<version> tag 的 Release 上。
  # 为什么在 CI 里搬而不是本地上传：本地到 GitHub 的通道每 ~20MB 重置一次连接，
  # 651MB 的 artifact 续传/分片都极慢且拼出过损坏文件；runner 与 GitHub 同内网，
  # download-artifact 取本 run 产物零外网传输，上传 Release 资产走内网稳定。
  # 只挂三资产（用户裁定）：Win 安装版、Win 便携版、安卓 APK；web zip 不挂。
  publish-assets:
    # 0.11 两阶段：dev 推送只做构建与测试，不碰 Release；
    # 合并主干（master）或推 tag 时才执行发版搬运
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    needs: [build, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: win

      - name: Download android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-artifact
          path: apk

      - name: Read version
        id: ver
        run: |
          EXE=$(ls win/release/*-windows-x64-setup.exe | head -1)
          V=$(echo "$EXE" | sed -E 's/.*richkobe-([0-9]+\.[0-9]+\.[0-9]+)-windows.*/\1/')
          # 版本提取失败必须立即红，否则会创建出 refs/tags/v 这种游离 tag
          if [ -z "$V" ] || [ "$V" = "$EXE" ]; then
            echo "FAIL: 从 exe 文件名提取版本失败，EXE=$EXE"
            ls -R win | head -20
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本: $V"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          TAG="v$V"
          # tag 不存在则创建（指向本 run 的提交）
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          fi
          # Release 不存在则创建（body 从 CHANGELOG 抽当前版本段）
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            awk -v v="## v$V" 'index($0,v)==1{f=1} f&&/^## v/&&index($0,v)!=1{exit} f{print}' CHANGELOG.md > body.md
            gh release create "$TAG" --title "v$V — 原神祈愿模拟器" --notes-file body.md
          fi
          gh release upload "$TAG" \
            "win/release/genshin-wish-roll-richkobe-$V-windows-x64-setup.exe" \
            "win/genshin-wish-roll-richkobe-$V-windows-x64-portable.zip" \
            "apk/genshin-wish-roll-richkobe-$V-android-arm64.apk" \
            --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
